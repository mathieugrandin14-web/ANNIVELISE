<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 12 - Anniversaire d'Élise</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
        }

        input {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #0078d4;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #005ea6;
        }

        #resultat {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🎂 Question 12</h1>

    <p>
        <strong>
            Quels étaient les deux penchants criminels d’Élise quand elle était petite ?
        </strong>
    </p>

    <p>
        Pas le droit de rejouer plusieurs fois ! Notez "A" ou "B" dans la zone de texte <br><br>

        <strong>A.</strong> Pyromanie et kleptomanie<br>
        <strong>B.</strong> Mythomanie et vandalisme
    </p>

    <input type="text" id="reponse" placeholder="Tapez A ou B">

    <br><br>

    <button onclick="verifier()">Valider</button>

    <div id="resultat"></div>

</div>

<script>
function verifier() {

    const saisie = document
        .getElementById("reponse")
        .value
        .trim()
        .toUpperCase();

    const resultat = document.getElementById("resultat");

    if (saisie === "A") {
        resultat.innerHTML = "✅ VRAI ! Elle a mis le feu au nounours de sa mère et volé des Polly Pocket à la sœur d’une amie de sa sœur !";
        resultat.style.color = "green";
    } else {
        resultat.innerHTML = "❌ FAUX ! Elle a mis le feu au nounours de sa mère et volé des Polly Pocket à la sœur d’une amie de sa sœur !";
        resultat.style.color = "red";
    }
}
</script>

</body>
</html>
