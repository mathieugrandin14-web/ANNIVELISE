<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 20 - Anniversaire d'Élise</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
        }

        input {
            width: 120px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #0078d4;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #005ea6;
        }

        #resultat {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🎂 Question 20</h1>

    <p>
        <strong>
            Avec quel objet Élise a failli tuer son frère ?
        </strong>
    </p>

    <p>
        <strong>A</strong> - Une boule de pétanque ?<br>
        <strong>B</strong> - Une fourchette ?
    </p>

    <p>
        <em>
            (Une seule chance pour répondre, notez "A" ou "B" dans la zone de texte)
        </em>
    </p>

    <input type="text" id="reponse" maxlength="1" placeholder="A ou B">

    <br>

    <button onclick="verifier()">Valider</button>

    <div id="resultat"></div>

</div>

<script>

let dejaJoue = false;

function verifier() {

    if (dejaJoue) {
        return;
    }

    dejaJoue = true;

    const saisie = document
        .getElementById("reponse")
        .value
        .trim()
        .toUpperCase();

    const resultat = document.getElementById("resultat");

    if (saisie === "A") {
        resultat.innerHTML = "✅ VRAI ! Élise a failli tuer son frère avec une boule de pétanque.";
        resultat.style.color = "green";
    } else {
        resultat.innerHTML = "❌ FAUX ! Élise a failli tuer son frère avec une boule de pétanque.";
        resultat.style.color = "red";
    }

    document.getElementById("reponse").disabled = true;
}

</script>

</body>
</html>
