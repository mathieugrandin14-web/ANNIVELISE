<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 4 - Anniversaire d'Élise</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 1.2em;
        }

        select {
            width: 250px;
            padding: 12px;
            font-size: 18px;
            margin: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #0078d4;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #005ea6;
        }

        #resultat {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
        }

        .exemple {
            margin-top: 40px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
            font-size: 18px;
        }

        .rang {
            margin: 8px 0;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🎂 Question 4</h1>

    <p>
        <strong>Où se trouve Élise sur la photo ?</strong>
    </p>

    <div>
        <select id="rang">
            <option value="">Choisissez un rang</option>
            <option value="1">RANG 1</option>
            <option value="2">RANG 2</option>
            <option value="3">RANG 3</option>
        </select>
    </div>

    <div>
        <select id="position">
            <option value="">Choisissez une position</option>
            <option value="1">POSITION 1</option>
            <option value="2">POSITION 2</option>
            <option value="3">POSITION 3</option>
            <option value="4">POSITION 4</option>
            <option value="5">POSITION 5</option>
            <option value="6">POSITION 6</option>
            <option value="7">POSITION 7</option>
        </select>
    </div>

    <button onclick="verifier()">Valider</button>

    <div id="resultat"></div>

    <div class="exemple">
        <strong>Exemple de numérotation :</strong>

        <div class="rang">
            RANG 1 : 1 &nbsp; 2 &nbsp; 3 &nbsp; 4 &nbsp; 5 &nbsp; 6 &nbsp; 7
        </div>

        <div class="rang">
            RANG 2 : 1 &nbsp; 2 &nbsp; 3 &nbsp; 4 &nbsp; 5 &nbsp; 6 &nbsp; 7
        </div>

        <div class="rang">
            RANG 3 : 1 &nbsp; 2 &nbsp; 3 &nbsp; 4 &nbsp; 5 &nbsp; 6 &nbsp; 7
        </div>
    </div>

</div>

<script>

function verifier() {

    const rang = document.getElementById("rang").value;
    const position = document.getElementById("position").value;

    const resultat = document.getElementById("resultat");

    if (rang === "1" && position === "2") {

        resultat.innerHTML =
            "✅ BRAVO ! Tu as gagné, tu remportes un autocollant !";

        resultat.style.color = "green";

    } else {

        resultat.innerHTML =
            "❌ Faux ! Recommencez.";

        resultat.style.color = "red";

    }
}

</script>

</body>
</html>
