<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 4 - Anniversaire d'Élise</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .rang {
            margin: 35px 0;
        }

        .titre-rang {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .point {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #333;
            background-color: white;
            cursor: pointer;
            margin: 0 8px;
            display: inline-block;
            transition: 0.2s;
        }

        .point:hover {
            background-color: #ddd;
        }

        #resultat {
            margin-top: 30px;
            font-size: 26px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🎂 Question 4</h1>

    <p>
        <strong>Où se trouve Élise sur la photo ?</strong>
    </p>

    <div class="rang">
        <div class="titre-rang">Rang 1</div>

        <div class="point" onclick="verifier(1,1)"></div>
        <div class="point" onclick="verifier(1,2)"></div>
        <div class="point" onclick="verifier(1,3)"></div>
        <div class="point" onclick="verifier(1,4)"></div>
        <div class="point" onclick="verifier(1,5)"></div>
        <div class="point" onclick="verifier(1,6)"></div>
        <div class="point" onclick="verifier(1,7)"></div>
    </div>

    <div class="rang">
        <div class="titre-rang">Rang 2</div>

        <div class="point" onclick="verifier(2,1)"></div>
        <div class="point" onclick="verifier(2,2)"></div>
        <div class="point" onclick="verifier(2,3)"></div>
        <div class="point" onclick="verifier(2,4)"></div>
        <div class="point" onclick="verifier(2,5)"></div>
        <div class="point" onclick="verifier(2,6)"></div>
        <div class="point" onclick="verifier(2,7)"></div>
    </div>

    <div class="rang">
        <div class="titre-rang">Rang 3</div>

        <div class="point" onclick="verifier(3,1)"></div>
        <div class="point" onclick="verifier(3,2)"></div>
        <div class="point" onclick="verifier(3,3)"></div>
        <div class="point" onclick="verifier(3,4)"></div>
        <div class="point" onclick="verifier(3,5)"></div>
        <div class="point" onclick="verifier(3,6)"></div>
        <div class="point" onclick="verifier(3,7)"></div>
    </div>

    <div id="resultat"></div>

</div>

<script>

function verifier(rang, position) {

    const resultat = document.getElementById("resultat");

    /* Bonne réponse : 2ème point du 1er rang */

    if (rang === 1 && position === 2) {

        resultat.innerHTML =
            "✅ BRAVO ! Tu as gagné, tu remportes un autocollant !";

        resultat.style.color = "green";

    } else {

        resultat.innerHTML =
            "❌ Faux ! Recommencez.";

        resultat.style.color = "red";

    }
}

</script>

</body>
</html>
